    var FetchPageNumPrev = async (e) => {
        let t = document.querySelector(".articles-container"),
          n = t.getAttribute("data-catid"),
          o = await fetch(`/article-load-items.bc?catid=${n}&pagenum=${e}`),
          r = await o.text();
        t.innerHTML = r;
      },
      FetchPageNumNext = async (e) => {
