<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0,shrink-to-fit=no,viewport-fit=cover" />
    <title>[##cms.seo.title|(مبین مسافر ملل پرداخت آنلاین)##]</title>
    <meta name="description" content="[##cms.seo.description|(شرکت خدمات مسافرت هوایی و گردشگری  مبین مسافر ملل)##]" />
    <basis core="dbsource" source="hosting" name="tag" urlid="[##cms.seo.urlid##]">
        <member type="list" name="list" request="taglist" preview=""></member>
    </basis>
    <basis core="print" datamembername="tag.list">
        <face filter="key = 'canonical'">
            <link rel="canonical" href="@value" />
        </face>
        <face>
            <meta property="@key" content="@value" />
        </face>
    </basis>
    <basis core="call" file="pwa.inc" />
    <basis core="call" file="style.inc" />
    <link rel="stylesheet" href="https://cdn.basiscore.net/basisfly.com/css/swiper-bundle.min.css" />
</head>

<body class="overflow-x-hidden bg-secondary-50">
    <basis core="call" file="header.inc" />
    <main class="flex justify-center w-full mt-20 mb-11">
        <div class="px-4 z-20 w-full lg:px-4 xl:!w-[1280px] xl:!px-0 flex flex-col gap-5">
            <h1 class="text-2xl font-semibold Iran-sans mt-4">پرداخت اینترنتی
            </h1>
            <div class="payment-container payment__container w-full">
                <div class=" w-full">
                    <div class="payment-content p-6 relative bg-secondary-100 border border-secondary-200   rounded-lg">
                        <div class="flex justify-between payment-title pb-8 mb-8">

                            <div class="flex flex-col gap-3 w-full">
                                <div class="text-xl mb-2">درگاه امن پرداخت</div>
                                <div class="text-sm">از این درگاه میتوانید مبالغی را که کارشناسان فروش ما به شما اعلام
                                    کرده
                                    اند را پرداخت
                                    نمایید </div>

                            </div>
                        </div>
                        <div class="payment__content ">
                            <div class="text-base">
                                <basis core="schema" run="atclient"
                                    schemaurl="/schema/domainform/7B9E93EC-5A51-46BA-8CCC-2888DE362F62/0A6DE7FF-4551-42FB-ADB7-056AFF18E1D5/fa/پرداخت-های-دلخواه"
                                    displaymode="new" button="[data-btn-submit]" resultsourceid="edit.data"
                                    OnRendered="schemaRendered">
                                </basis>
                                <basis core="api" if="{##cms.submit.run|(false)##}" run="atclient"
                                    url="/schema/domainform/7B9E93EC-5A51-46BA-8CCC-2888DE362F62/fa/editobject"
                                    method="post"
                                    body="object_edit={##cms.submit.value##}&captcha={##cms.submit.captcha##}&captchaid={##cms.submit.captchaid##}"
                                    content-type="application/x-www-form-urlencoded" triggers='cms.submit'
                                    OnProcessed="OnProcessedEditObject">
                                </basis>
                                <basis core="dbsource" source="trust_login" name="captcha" run="atclient"
                                    triggers="captcha.refresh">
                                    <member name="code" type="scalar" request="captcha"></member>
                                </basis>
                                <div data-bc-question="" class="captcha w-full ">
                                    <div data-bc-title-container="" class="w-full text-secondary">
                                        <span data-bc-question-title="" data-bc-schema-info-prpid="2582"
                                            data-sys-text="">کد امنیتی</span>
                                    </div>
                                    <div id="captchaContainer" class="w-full" data-bc-answer-container=""
                                        data-bc-schema-info-multi="0" data-bc-schema-info-word="1052"
                                        data-bc-schema-info-part="1" data-bc-schema-info-part-0-type="text">

                                        <div data-bc-answer-collection="">
                                            <div data-bc-answer="" class="w-full flex ">
                                                <div data-bc-part-container=""
                                                    class="w-full flex justify-between items-center ">
                                                    <basis datamembername="captcha.code" core="print" run="atclient">
                                                        <face>
                                                            <script type="text/template">
                                                        <div data-bc-part-container="" class="w-full flex justify-between items-center captcha-flex">
                                                            <div data-bc-part="" class="captcha" data-bc-part-related-cell="">
                                                              <input type="text" class="contactUsInput" name="captcha" maxlength="4" />
                                                              <input type="hidden" name="captchaid" value="@captcha@" />
                                                            </div>
                                                            <div data-bc-part="" class="refresh" data-bc-part-related-cell="">
                                                                <svg width="40" height="40" onclick="renderCaptchaCode(this)" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokewidth="{1.5}" stroke="currentColor" class="inline-block cursor-pointer mt-1 ml-1 mr-1">
                                                                    <path strokelinecap="round" strokelinejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 0 0-3.7-3.7 48.678 48.678 0 0 0-7.324 0 4.006 4.006 0 0 0-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 0 0 3.7 3.7 48.656 48.656 0 0 0 7.324 0 4.006 4.006 0 0 0 3.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3-3 3"></path>
                                                                </svg>
                                                              <img class="inline-block rounded-xl" src="/@captcha@" width="80"  />
                                                            </div>
                                                          </div>
                                                    </script>
                                                        </face>
                                                    </basis>
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="w-full flex justify-between">
                                <span></span>
                                <button
                                    class="text-sm  text-white text-center data-bc-btn rounded-lg cursor-pointer bg-primary px-3 pb-2"
                                    type="button" data-btn-submit>
                                    ارسال
                                </button>
                            </div>
                            <basis core="callback" run="atclient" method="submitPayment" triggers="edit.data"></basis>
                            <div class="message__api text-center"></div>
                        </div>
                        <div class="hidden mb-5 loading__api w-full" id="ballsWaveG">
                            <div class="w-full flex justify-center"><span class="loader"></span></div>

                        </div>
                        <basis core="callback" run="atclient" method="submitPayment" triggers="edit.data"></basis>
                        <div class="message-api text-center"></div>
                    </div>


                </div>
            </div>
        </div>
    </main>
    <basis core="call" file="footer.inc" />
    <script src="[##cms.cms.cdn##]/_js/jquery/jquery-3.6.3.min.js" type="text/javascript"></script>
    <script src="[##cms.cms.cdn##]/js/mobin-custom-payment.js" type="text/javascript"></script>

</body>

</html>
